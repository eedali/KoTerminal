name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bridge/package-lock.json
      - run: npm ci
      - run: npm ci --prefix bridge
      - name: Build the plugin
        run: npm run build
      - name: Committed dist/index.js matches the sources
        run: git diff --exit-code -- dist/index.js
      - name: Plugin tests
        run: npm test
      - name: Bridge tests (includes a real shell)
        run: npm --prefix bridge test
